name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build deb
        run: cd src-tauri && cargo tauri build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build dmg (Apple Silicon)
        run: cd src-tauri && cargo tauri build --target aarch64-apple-darwin
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-macos-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build dmg (Intel)
        run: cd src-tauri && cargo tauri build --target x86_64-apple-darwin
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-intel
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  release:
    needs: [build-linux, build-macos-arm, build-macos-intel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename and upload to release
        run: |
          for f in artifacts/macos-dmg-arm/*.dmg; do
            cp "$f" "$(echo "$f" | sed 's/cs-router/cs-router-aarch64/')"
          done
          for f in artifacts/macos-dmg-intel/*.dmg; do
            cp "$f" "$(echo "$f" | sed 's/cs-router/cs-router-x86_64/')"
          done
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/linux-deb/*.deb \
            artifacts/macos-dmg-arm/cs-router-aarch64*.dmg \
            artifacts/macos-dmg-intel/cs-router-x86_64*.dmg \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
