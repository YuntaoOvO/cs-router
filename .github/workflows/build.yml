name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build deb
        run: cd src-tauri && cargo tauri build
      - name: Rename with platform
        run: |
          cd src-tauri/target/release/bundle/deb
          for f in *.deb; do cp "$f" "cs-router-linux-amd64.deb"; done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/cs-router-linux-amd64.deb

  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build dmg (Apple Silicon)
        run: cd src-tauri && cargo tauri build --target aarch64-apple-darwin
      - name: Rename with platform
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          for f in *.dmg; do cp "$f" "cs-router-macos-aarch64.dmg"; done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/cs-router-macos-aarch64.dmg

  build-macos-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build dmg (Intel)
        run: cd src-tauri && cargo tauri build --target x86_64-apple-darwin
      - name: Rename with platform
        run: |
          cd src-tauri/target/x86_64-apple-darwin/release/bundle/dmg
          for f in *.dmg; do cp "$f" "cs-router-macos-x86_64.dmg"; done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/cs-router-macos-x86_64.dmg

  release:
    needs: [build-linux, build-macos-arm, build-macos-intel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release with all artifacts
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "CS Router $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/linux-deb/cs-router-linux-amd64.deb \
            artifacts/macos-arm/cs-router-macos-aarch64.dmg \
            artifacts/macos-intel/cs-router-macos-x86_64.dmg
        env:
          GH_TOKEN: ${{ github.token }}
